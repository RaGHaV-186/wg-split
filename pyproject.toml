[project]
name = "wg-split"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
wg-split = "wg_split.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
